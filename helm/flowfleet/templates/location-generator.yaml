{{- if .Values.locationGenerator.enabled }}
{{- $name := include "flowfleet.component.fullname" (list . "location-generator") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "location-generator") | nindent 4 }}
spec:
  ports:
    - { name: http, port: 8090, targetPort: http }
  selector: {{- include "flowfleet.selectorLabels" (list . "location-generator") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "location-generator") | nindent 4 }}
spec:
  replicas: {{ .Values.locationGenerator.replicas }}
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "location-generator") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flowfleet.selectorLabels" (list . "location-generator") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: location-generator
          image: {{ include "flowfleet.image" (list . .Values.locationGenerator.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8090 }
          envFrom:
            - configMapRef: { name: {{ include "flowfleet.envConfigMapName" . }} }
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: GENERATOR_DRIVERS
              value: {{ .Values.locationGenerator.drivers | quote }}
            - name: GENERATOR_SPEEDUP
              value: {{ .Values.locationGenerator.speedup | quote }}
            - name: GENERATOR_SEED
              value: {{ .Values.locationGenerator.seed | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.locationGenerator.resources | nindent 12 }}
      {{- include "flowfleet.scheduling" . | nindent 6 }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowfleet.componentLabels" (list . "location-generator") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "location-generator") | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
