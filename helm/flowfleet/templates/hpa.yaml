{{- if and .Values.locationConsumer.enabled .Values.locationConsumer.hpa.enabled }}
{{- $name := include "flowfleet.component.fullname" (list . "location-consumer") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "location-consumer") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.locationConsumer.hpa.minReplicas }}
  maxReplicas: {{ .Values.locationConsumer.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.locationConsumer.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Kafka rebalances on every replica change — don't thrash.
      stabilizationWindowSeconds: 120
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
{{- end }}
