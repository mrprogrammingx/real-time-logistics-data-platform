{{- if .Values.api.enabled }}
{{- $name := include "flowfleet.component.fullname" (list . "api") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http }
  selector: {{- include "flowfleet.selectorLabels" (list . "api") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flowfleet.selectorLabels" (list . "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "flowfleet.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: {{ include "flowfleet.envConfigMapName" . }} }
            - secretRef: { name: {{ include "flowfleet.secretName" . }} }
          env:
            - name: SERVER_PORT
              value: "8080"
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      {{- include "flowfleet.scheduling" . | nindent 6 }}
{{- if and .Values.api.pdb.enabled (gt (int .Values.api.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "api") | nindent 6 }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowfleet.componentLabels" (list . "api") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
