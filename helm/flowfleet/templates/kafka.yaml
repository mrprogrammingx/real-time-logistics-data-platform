{{- if .Values.kafka.enabled }}
{{- $name := include "flowfleet.component.fullname" (list . "kafka") }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "kafka") | nindent 4 }}
spec:
  # Headless: clients resolve the broker pod directly, and the advertised
  # listener below uses the same stable name.
  clusterIP: None
  ports:
    - { name: broker, port: 9092, targetPort: broker }
    - { name: controller, port: 9093, targetPort: controller }
  selector: {{- include "flowfleet.selectorLabels" (list . "kafka") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "kafka") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "kafka") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flowfleet.selectorLabels" (list . "kafka") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ include "flowfleet.image" (list . .Values.kafka.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@$(POD_NAME).{{ $name }}.{{ $ns }}.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "BROKER://$(POD_NAME).{{ $name }}.{{ $ns }}.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "BROKER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          readinessProbe:
            exec: { command: ["bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: { port: broker }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      {{- include "flowfleet.scheduling" . | nindent 6 }}
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.kafka.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
  {{- else }}
      volumes:
        - { name: data, emptyDir: {} }
  {{- end }}
{{- end }}
