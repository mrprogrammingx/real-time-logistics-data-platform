{{- if .Values.schemaRegistry.enabled }}
{{- $name := include "flowfleet.component.fullname" (list . "schema-registry") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "schema-registry") | nindent 4 }}
spec:
  ports:
    - { name: http, port: 8081, targetPort: http }
  selector: {{- include "flowfleet.selectorLabels" (list . "schema-registry") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "flowfleet.componentLabels" (list . "schema-registry") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "flowfleet.selectorLabels" (list . "schema-registry") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flowfleet.selectorLabels" (list . "schema-registry") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: schema-registry
          image: {{ include "flowfleet.image" (list . .Values.schemaRegistry.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: {{ $name | quote }}
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://{{ include "flowfleet.kafkaHeadless" . }}:9092"
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: {{ .Values.schemaRegistry.compatibilityLevel | quote }}
          startupProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
            failureThreshold: 30           # waits out a slow Kafka
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            failureThreshold: 6
          resources: {{- toYaml .Values.schemaRegistry.resources | nindent 12 }}
      {{- include "flowfleet.scheduling" . | nindent 6 }}
{{- end }}
