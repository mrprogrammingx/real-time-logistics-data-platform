spring:
  application:
    name: flowfleet-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowfleet}
    username: ${DB_USER:flowfleet}
    password: ${DB_PASSWORD:flowfleet}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      pool-name: flowfleet-api-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    # PostGIS lives in the 'public' schema; keep Flyway history there too.
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.jdbc.core: info
    com.flowfleet: debug
