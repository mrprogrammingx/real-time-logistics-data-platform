spring:
  application:
    name: flowfleet-location-generator
  threads:
    virtual:
      enabled: true

flowfleet:
  generator:
    drivers: ${GENERATOR_DRIVERS:200}
    tick-interval: ${GENERATOR_TICK:1s}
    speedup-factor: ${GENERATOR_SPEEDUP:1.0}
    seed: ${GENERATOR_SEED:42}
    enabled: ${GENERATOR_ENABLED:true}
    auto-create-topics: ${GENERATOR_AUTO_CREATE_TOPICS:true}
    topic: ${GENERATOR_TOPIC:flowfleet.driver.locations}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:18085}

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.flowfleet: info
    org.apache.kafka.clients: warn
