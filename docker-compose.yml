# ============================================================================
# FlowFleet — Phase 1 local stack.
#
#   postgres  : PostGIS-enabled operational database (source of truth)
#   api       : Spring Boot service, runs Flyway migrations on startup
#   adminer   : lightweight DB UI at http://localhost:8081
#
# Kafka, Debezium, Flink, ClickHouse, etc. arrive in later phases and will be
# layered in via additional compose files (docker-compose.kafka.yml, ...).
# ============================================================================
name: flowfleet

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flowfleet-postgres
    environment:
      POSTGRES_DB: flowfleet
      POSTGRES_USER: flowfleet
      POSTGRES_PASSWORD: flowfleet
    ports:
      # Host ports are deliberately non-standard to avoid clashing with other local stacks.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowfleet -d flowfleet"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Settings that Debezium will need in Phase 3 — harmless now, and it means
    # the WAL is already in the right mode when CDC is switched on.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: flowfleet/api:0.1.0
    container_name: flowfleet-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowfleet
      DB_USER: flowfleet
      DB_PASSWORD: flowfleet
      SERVER_PORT: 8080
    ports:
      - "18080:8080"
    # Healthcheck is defined in the image (services/api/Dockerfile).

  adminer:
    image: adminer:4
    container_name: flowfleet-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pgdata:
