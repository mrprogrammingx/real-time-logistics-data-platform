# ============================================================================
# FlowFleet — local stack (Phases 1–5).
#
#   postgres           : PostGIS operational database (source of truth)
#   api                : Spring Boot service, runs Flyway migrations on startup
#   adminer            : DB UI                     http://localhost:18081
#   kafka              : single-node KRaft broker  localhost:19092 (host)
#   schema-registry    : Confluent Schema Registry http://localhost:18085
#   kafka-ui           : topics / groups / connect http://localhost:18082
#   kafka-connect      : Debezium PostgreSQL CDC   http://localhost:18083
#   flink-jobmanager   : Flink session cluster UI  http://localhost:18086
#   flink-taskmanager  : Flink worker (scale with --scale)
#   location-generator : simulated fleet -> flowfleet.driver.locations
#   location-consumer  : consumer-group member (scale with --scale)
#
# ClickHouse / TimescaleDB / BigQuery sinks arrive in later phases.
# Submit the Flink jobs with:  make flink-submit-all
# ============================================================================
name: flowfleet

services:
  postgres:
    # Multi-arch rebuild of postgis/postgis (which is amd64-only) — runs native on arm64.
    image: imresamu/postgis:16-3.5
    container_name: flowfleet-postgres
    environment:
      POSTGRES_DB: flowfleet
      POSTGRES_USER: flowfleet
      POSTGRES_PASSWORD: flowfleet
    ports:
      # Host ports are deliberately non-standard to avoid clashing with other local stacks.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowfleet -d flowfleet"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Settings that Debezium will need in Phase 3 — harmless now, and it means
    # the WAL is already in the right mode when CDC is switched on.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: flowfleet/api:0.1.0
    container_name: flowfleet-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowfleet
      DB_USER: flowfleet
      DB_PASSWORD: flowfleet
      SERVER_PORT: 8080
    ports:
      - "18080:8080"
    # Healthcheck is defined in the image (services/api/Dockerfile).

  adminer:
    image: adminer:4
    container_name: flowfleet-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # --------------------------------------------------------------------------
  # Kafka (KRaft, single combined broker+controller node)
  #   internal clients : kafka:29092
  #   host clients     : localhost:19092
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: flowfleet-kafka
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: flowfleet-kraft-0000000000
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: flowfleet-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flowfleet-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flowfleet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8085
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # --------------------------------------------------------------------------
  # Kafka Connect (distributed) + the Debezium PostgreSQL connector.
  # Register the connector with:  make cdc-register
  # --------------------------------------------------------------------------
  kafka-connect:
    build:
      context: .
      dockerfile: services/connect/Dockerfile
    image: flowfleet/kafka-connect:0.1.0
    container_name: flowfleet-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "18083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_GROUP_ID: flowfleet-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24

  # --------------------------------------------------------------------------
  # Analytical sinks (Phase 5)
  #   timescaledb : operational time-series   localhost:15433
  #   clickhouse  : event-level analytics     http://localhost:18123
  # --------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: flowfleet-timescaledb
    environment:
      POSTGRES_DB: flowfleet
      POSTGRES_USER: flowfleet
      POSTGRES_PASSWORD: flowfleet
    ports:
      - "15433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./database/timescaledb/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowfleet -d flowfleet"]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: flowfleet-clickhouse
    environment:
      CLICKHOUSE_DB: flowfleet
      CLICKHOUSE_USER: flowfleet
      CLICKHOUSE_PASSWORD: flowfleet
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./database/clickhouse/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --------------------------------------------------------------------------
  # Flink session cluster. Job jar is baked into the image at
  # /opt/flink/usrlib/flowfleet-flink-jobs.jar — submit with `make flink-submit-*`.
  # --------------------------------------------------------------------------
  flink-jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    image: flowfleet/flink:0.1.0
    container_name: flowfleet-flink-jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "18086:8081"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      TIMESCALE_URL: jdbc:postgresql://timescaledb:5432/flowfleet
      TIMESCALE_USER: flowfleet
      TIMESCALE_PASSWORD: flowfleet
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/flowfleet
      CLICKHOUSE_USER: flowfleet
      CLICKHOUSE_PASSWORD: flowfleet
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend.type: rocksdb
        execution.checkpointing.interval: 30s
        execution.checkpointing.unaligned: true
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: exponential-delay
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  flink-taskmanager:
    image: flowfleet/flink:0.1.0
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      TIMESCALE_URL: jdbc:postgresql://timescaledb:5432/flowfleet
      TIMESCALE_USER: flowfleet
      TIMESCALE_PASSWORD: flowfleet
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/flowfleet
      CLICKHOUSE_USER: flowfleet
      CLICKHOUSE_PASSWORD: flowfleet
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  location-generator:
    build:
      context: .
      dockerfile: services/location-generator/Dockerfile
    image: flowfleet/location-generator:0.1.0
    container_name: flowfleet-location-generator
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      GENERATOR_DRIVERS: "200"
      GENERATOR_SPEEDUP: "1.0"
      SERVER_PORT: "8090"
    ports:
      - "18090:8090"

  location-consumer:
    build:
      context: .
      dockerfile: services/location-consumer/Dockerfile
    image: flowfleet/location-consumer:0.1.0
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      SERVER_PORT: "8091"
    # No container_name / fixed port so you can scale it:
    #   docker compose up -d --scale location-consumer=3

volumes:
  pgdata:
  tsdata:
  chdata:
