# kind cluster for FlowFleet: a single control-plane node that also schedules
# workloads. Everything is reached with `kubectl port-forward` (see k8s/README.md
# and `make k8s-ui` / `scripts/k8s.sh grafana`) — the chart's Services are all
# ClusterIP, so there are no host-port mappings here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: flowfleet
nodes:
  - role: control-plane
