global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9250"]

  - job_name: flink-taskmanager
    # TaskManagers report on :9251; DNS round-robins across scaled replicas.
    static_configs:
      - targets: ["flink-taskmanager:9251"]

  - job_name: flowfleet-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "api:8080"
          - "location-generator:8090"
          - "location-consumer:8091"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
