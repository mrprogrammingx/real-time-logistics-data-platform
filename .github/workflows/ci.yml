name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build + unit + integration tests
        # GitHub-hosted runners ship Docker, so Testcontainers integration tests run here.
        run: ./mvnw -B -ntp clean verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
          include_passed: true

  docker:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - { name: api,                dockerfile: services/api/Dockerfile }
          - { name: location-generator, dockerfile: services/location-generator/Dockerfile }
          - { name: location-consumer,  dockerfile: services/location-consumer/Dockerfile }
          - { name: connect,            dockerfile: services/connect/Dockerfile }
          - { name: flink,              dockerfile: flink/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.name }} image (no push)
        run: docker build -f ${{ matrix.dockerfile }} -t flowfleet/${{ matrix.name }}:ci .
